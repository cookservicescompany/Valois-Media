<body data-page=""><main id="main"><section class="section"><div class="container"><h1>Verify Email</h1><p id="verify-message" class="notice">Verifying your email address…</p></div></section><script>addEventListener("DOMContentLoaded",async()=>{const t=new URLSearchParams(location.search).get("token");const n=document.getElementById("verify-message");try{const r=await VMH_API.post("verify-email",{token:t});if(!r.ok)throw new Error(r.error);n.className="notice success";n.textContent=r.message||"Your email is verified."}catch(e){n.className="notice error";n.textContent=e.message}})</script></main></body></html>
